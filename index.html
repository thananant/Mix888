<!DOCTYPE html>
<html lang="th">
<head>

<style>
:root{
  --ink:#3d2b28; --muted:#9a857f; --line:#efe6e0; --bg:#faf6f2; --card:#ffffff;
  --accent:#c0201f; --accent-soft:#fce8e6; --accent-deep:#9e1414;
  --warn:#c47d2a; --warn-soft:#fbf0dd; --danger:#b52020; --danger-soft:#fae0de;
  --ok:#159b78; --ok-soft:#ddf4ee; --radius:18px;
  --display:'Mali','IBM Plex Sans Thai',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Thai',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:90px}
header{background:linear-gradient(135deg,#9e1414,#c0201f);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;box-shadow:0 3px 14px rgba(158,20,20,.18)}
header h1{font-size:17px;font-weight:700;font-family:var(--display)}
header h1 span{color:#ffd0cc;font-weight:500}
.cust{font-size:13px;color:rgba(255,255,255,.88);margin-top:2px}
main{max-width:640px;margin:0 auto;padding:12px}
.searchbox{width:100%;font:inherit;padding:12px 16px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);margin-bottom:10px}
.searchbox:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item{background:var(--card);border:1px solid #fbeef0;border-radius:var(--radius);padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(217,74,106,.05)}
.pimg{width:58px;height:58px;border-radius:12px;object-fit:cover;border:1px solid var(--line);flex-shrink:0;background:#f6f0ec;cursor:pointer}
.pimg-ph{width:58px;height:58px;border-radius:12px;border:1px dashed var(--line);flex-shrink:0;background:#faf5f1;display:flex;align-items:center;justify-content:center;font-size:22px;color:#d9c9c0}
#imgview{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
#imgview.show{display:flex}
#imgview img{max-width:100%;max-height:85vh;border-radius:14px;background:#fff}
.item.out{opacity:.55}
/* แจ้งค่าส่งขั้นต่ำ (เฉพาะลูกค้าส่งแบบ Lalamove) */
#shipnote{position:fixed;left:0;right:0;bottom:74px;z-index:19;padding:0 12px;pointer-events:none}
#shipnote .box{max-width:640px;margin:0 auto;border-radius:12px;padding:8px 13px;font-size:13px;font-weight:600;line-height:1.5;box-shadow:0 3px 12px rgba(0,0,0,.12)}
.shipwarn{background:#fff4e0;border:1px solid #f0d9a8;color:#a35b00}
.shipok{background:#e3f6ee;border:1px solid #b8e5d3;color:#0c6d52}
#confirm-shipnote .box,#s-shipnote .box{border-radius:12px;padding:9px 13px;font-size:13px;line-height:1.55;margin-top:8px}
/* สินค้าที่กำลังลดราคา — ให้เด่นชวนซื้อ */
.item.promo{border:2px solid #ff9345;background:linear-gradient(135deg,#fff8ea,#fff);box-shadow:0 4px 16px rgba(255,199,44,.28)}
.pbadge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#ff5722,#c0201f);color:#fff;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:99px;margin-bottom:3px;animation:ppulse 1.6s ease-in-out infinite;box-shadow:0 2px 6px rgba(224,60,20,.3)}
@keyframes ppulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.price .old{color:var(--muted);text-decoration:line-through;font-weight:500;font-size:12.5px;margin-right:6px}
.price.promo-p{font-size:16.5px;color:#e64a19}
.psave{display:inline-block;background:#ffe9d2;color:#c05000;font-size:11.5px;font-weight:700;border-radius:8px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.pends{font-size:11.5px;color:#c05000;font-weight:600;margin-top:1px}
#catchips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#catchips::-webkit-scrollbar{display:none}
.cchip{flex:none;font:inherit;font-size:13px;font-weight:600;padding:7px 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.cchip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(192,32,31,.25)}
.cchip .cn2{opacity:.65;font-weight:400;margin-left:3px}
.cathead{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-family:var(--display);font-size:15px;font-weight:700;color:var(--accent-deep)}
.cathead::after{content:'';flex:1;height:1px;background:var(--line)}
.cathead:first-child{margin-top:2px}
#promobanner{background:linear-gradient(135deg,#ff6f3c,#e0261f);color:#fff;border-radius:14px;padding:11px 15px;margin-bottom:10px;font-weight:700;display:none;box-shadow:0 4px 14px rgba(224,38,31,.28);font-family:var(--display);font-size:14.5px}
.info{flex:1;min-width:0}
.name{font-weight:600;line-height:1.35}
.pack{font-size:12.5px;color:var(--muted)}
.price{font-size:14px;color:var(--accent);font-weight:700;margin-top:2px}
.price small{color:var(--muted);font-weight:400}
.stock{font-size:12px;margin-top:2px}
.stock.ok{color:var(--ok)}
.stock.low{color:var(--warn);font-weight:600}
.stock.zero{color:var(--danger);font-weight:700}
.qtybox{display:flex;align-items:center;gap:6px}
.qbtn{width:38px;height:38px;border:none;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:700;cursor:pointer;flex-shrink:0}
.qbtn:disabled{opacity:.35}
.qin{width:52px;height:38px;text-align:center;font:inherit;font-weight:700;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.qin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#cartbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:20;box-shadow:0 -4px 18px rgba(217,74,106,.1)}
#cartbar .sum{flex:1}
#cartbar .n{font-size:13px;color:var(--muted)}
#cartbar .t{font-size:18px;font-weight:700;font-family:var(--display)}
.btn{font:inherit;font-weight:700;padding:13px 26px;border:none;border-radius:99px;cursor:pointer}
.btn-p{background:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(209,77,106,.26)}
.btn-p:disabled{opacity:.4}
.btn-g{background:#f1ece6;color:var(--ink)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
#overlay.show{display:flex}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:85vh;overflow-y:auto;padding:20px 16px 24px}
.sheet h2{font-size:17px;font-weight:700;margin-bottom:12px}
.cline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.cline .cn{flex:1}
.cline .cq{color:var(--muted);white-space:nowrap}
.cline .ca{font-weight:600;white-space:nowrap}
.total-line{display:flex;justify-content:space-between;padding:14px 0;font-size:17px;font-weight:700}
#success{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#success.show{display:flex}
.bigcheck{width:88px;height:88px;border-radius:50%;background:#e1f5ee;color:#0f6e56;font-size:44px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
#success h2{font-size:20px;margin-bottom:6px;font-family:var(--display)}
#success .ono{font-size:15px;color:var(--muted);margin-bottom:4px}
#success .ot{font-size:26px;font-weight:700;color:var(--accent);margin-bottom:24px;font-family:var(--display)}
.tabbar{display:flex;gap:8px;margin-bottom:14px}
.ctab{flex:1;font:inherit;font-weight:600;padding:11px;border:none;border-radius:99px;background:var(--card);color:var(--muted);cursor:pointer;border:1.5px solid var(--line)}
.ctab.active{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(209,77,106,.24)}
.datefilter{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qb{font:inherit;font-size:13px;font-weight:600;padding:6px 15px;border:none;border-radius:99px;background:#f6ece8;color:var(--muted);cursor:pointer}
.qb.active{background:var(--accent);color:#fff}
.drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.drow input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.hsum{font-size:13.5px;color:var(--muted);margin-bottom:10px;padding:0 4px}
.ocard{background:var(--card);border:1px solid #fbeef0;border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(217,74,106,.05)}
.ocard .oh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.ocard .ono{font-weight:700;font-size:15px}
.ocard .od{font-size:12.5px;color:var(--muted)}
.ocard .oa{font-weight:700;font-size:16px;white-space:nowrap}
.oitems{font-size:13px;color:#5c4a42;margin:8px 0;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.oitems div{display:flex;justify-content:space-between;padding:2px 0}
.statusrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.statusbadge{color:#fff;font-size:12.5px;font-weight:600;padding:3px 12px;border-radius:99px}
.paytag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.paytag.paid{background:#e1f5ee;color:#0f6e56}
.paytag.unpaid{background:var(--warn-soft);color:var(--warn)}
.steps{display:flex;gap:0;margin-top:10px}
.step{flex:1;text-align:center;position:relative;font-size:11px;color:#c3b4ab}
.step::before{content:'';position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#eee;z-index:0}
.step:first-child::before{display:none}
.step .dot{width:24px;height:24px;border-radius:50%;background:#eee;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:12px;position:relative;z-index:1}
.step.done{color:var(--ok);font-weight:600}
.step.done .dot{background:var(--ok)}
.step.done::before{background:var(--ok)}
.step.wait .dot{background:#e0d5cc}
.hist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:16px}
.hist h3{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--muted)}
.hline{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.hline:last-child{border-bottom:none}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.tag-new{background:var(--warn-soft);color:var(--warn)}
.tag-billed{background:#e1f5ee;color:#0f6e56}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:92vw;text-align:center}
#toast.show{opacity:1}
#errpage{display:none;text-align:center;padding:60px 24px}
#errpage.show{display:block}
.empty{text-align:center;color:var(--muted);padding:40px 0}
/* ===== แก้การแสดงผลบน iPhone (iOS Safari / เบราว์เซอร์ใน LINE) ===== */
.searchbox,.qin,.drow input{font-size:16px}            /* กัน iOS ซูมหน้าเองตอนแตะช่องกรอก (ตัวอักษร<16px จะโดนซูม) */
button,input,select,.ctab,.qb,.qbtn{touch-action:manipulation} /* กันดับเบิลแตะปุ่ม +/− แล้วหน้าซูม/กระตุก */
.sheet{-webkit-overflow-scrolling:touch}
.drow input[type=date]{min-width:132px;-webkit-appearance:none;appearance:none;background:#fff} /* ช่องวันที่ iOS ไม่หดจนอ่านไม่ได้ */
body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
#cartbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))}   /* ปุ่มสั่งสินค้าไม่จมแถบโฮมล่าง iPhone */
.sheet{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#toast{bottom:calc(100px + env(safe-area-inset-bottom))}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px">
    <img src="logo.png" alt="Mix Fresh 168" style="width:44px;height:44px;object-fit:cover;border-radius:13px;flex-shrink:0;border:2px solid rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(0,0,0,.15)">
    <h1 style="margin:0">Mix Fresh 168 <span>· สั่งสินค้า</span></h1>
  </div>
  <div class="cust" id="cust-name">กำลังโหลด…</div>
</header>

<main>
  <div id="errpage">
    <div style="font-size:44px;margin-bottom:12px">🔒</div>
    <h2 style="margin-bottom:8px">เปิดหน้านี้ไม่ได้</h2>
    <p id="errmsg" style="color:var(--muted)"></p>
  </div>

  <div id="shop" style="display:none">
    <div class="tabbar">
      <button class="ctab active" id="tab-order" onclick="showTab('order')">🛒 สั่งของ</button>
      <button class="ctab" id="tab-history" onclick="showTab('history')">📋 ประวัติการสั่ง</button>
    </div>

    <div id="page-order">
      <input class="searchbox" id="search" placeholder="🔍 ค้นหาสินค้า…" oninput="render()">
      <div id="promobanner"></div>
      <div id="catchips"></div>
      <div id="list"></div>
    </div>

    <div id="page-history" style="display:none">
      <div class="datefilter">
        <div class="qbtns">
          <button class="qb" onclick="histRange('7')">7 วัน</button>
          <button class="qb active" onclick="histRange('30')">30 วัน</button>
          <button class="qb" onclick="histRange('90')">90 วัน</button>
          <button class="qb" onclick="histRange('all')">ทั้งหมด</button>
        </div>
        <div class="drow">
          <label>จาก</label><input type="date" id="h-from" onchange="renderHistory()">
          <label>ถึง</label><input type="date" id="h-to" onchange="renderHistory()">
        </div>
      </div>
      <div id="hist-summary" class="hsum"></div>
      <div id="hist-body"></div>
    </div>
  </div>
</main>

<div id="shipnote"></div>
<div id="cartbar" style="display:none">
  <div class="sum">
    <div class="n" id="cart-n">ยังไม่ได้เลือกสินค้า</div>
    <div class="t" id="cart-t">฿0.00</div>
  </div>
  <button class="btn btn-p" id="order-btn" onclick="openConfirm()" disabled>สั่งสินค้า</button>
</div>

<div id="overlay" onclick="if(event.target===this)closeConfirm()">
  <div class="sheet">
    <h2>ยืนยันการสั่งสินค้า</h2>
    <div id="confirm-list"></div>
    <div class="total-line"><span id="confirm-total-l">รวมทั้งหมด</span><span id="confirm-total"></span></div>
    <div id="confirm-shipnote"></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-g" style="flex:1" onclick="closeConfirm()">กลับไปแก้</button>
      <button class="btn btn-p" style="flex:2" id="confirm-btn" onclick="placeOrder()">✓ ยืนยันสั่งสินค้า</button>
    </div>
  </div>
</div>

<div id="pin-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;align-items:center;justify-content:center;padding:16px">
  <div class="sheet" style="max-width:340px;text-align:center">
    <h2 style="margin-bottom:4px">🔐 ยืนยันการสั่งซื้อ</h2>
    <p style="color:var(--muted);font-size:14px;margin:0 0 14px">ใส่รหัส 6 หลักของร้าน<br><span style="font-size:12.5px">(กรอกครั้งเดียว เครื่องนี้จะจำให้)</span></p>
    <input id="pin-input" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
      style="width:100%;text-align:center;font-size:30px;letter-spacing:10px;padding:10px;border-radius:12px;border:2px solid var(--line)"
      placeholder="••••••" oninput="this.value=this.value.replace(/\D/g,'')"
      onkeydown="if(event.key==='Enter')pinOk()">
    <div id="pin-err" style="display:none;color:var(--danger,#b52020);font-size:13.5px;margin-top:8px"></div>
    <p style="color:var(--muted);font-size:12.5px;margin:12px 0 0">ลืมรหัส? พิมพ์ <b>เปลี่ยน 123456</b> ในกลุ่มไลน์ของร้านเพื่อตั้งใหม่</p>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn btn-g" style="flex:1" onclick="pinCancel()">ยกเลิก</button>
      <button class="btn btn-p" style="flex:2" onclick="pinOk()">✓ ยืนยัน</button>
    </div>
  </div>
</div>

<div id="success">
  <div class="bigcheck">✓</div>
  <h2>สั่งสินค้าเรียบร้อย</h2>
  <div class="ono" id="s-no"></div>
  <div class="ot" id="s-total"></div>
  <div id="s-shipnote"></div>
  <button class="btn btn-p" onclick="backToShop()">สั่งสินค้าเพิ่ม</button>
</div>

<div id="imgview" onclick="this.classList.remove('show')"><img id="imgview-img" src="" alt=""></div>
<div id="toast"></div>

<script>
/* ================= ตั้งค่า ================= */
const SUPABASE_URL = 'https://eqbzpgynzgdwvouuzfwt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HqLNQDwR4omYcb7BNUEKIw_vyHCo4N-';
/* =========================================== */

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const fmt = n => '฿'+Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const hidePrice = () => !!(customer && customer.hide_prices);
const PIN_KEY = () => 'mf_pin_' + (token||'');
const savedPin = () => { try{return localStorage.getItem(PIN_KEY())||'';}catch(e){return '';} };
let _pinResolve=null;
function askPin(msg){
  return new Promise(res=>{
    _pinResolve=res;
    const el=document.getElementById('pin-err');
    if(msg){el.textContent=msg;el.style.display='block';}else el.style.display='none';
    document.getElementById('pin-input').value='';
    document.getElementById('pin-overlay').style.display='flex';
    setTimeout(()=>document.getElementById('pin-input').focus(),100);
  });
}
function pinClose(v){
  document.getElementById('pin-overlay').style.display='none';
  const r=_pinResolve;_pinResolve=null;if(r)r(v);
}
function pinOk(){
  const v=document.getElementById('pin-input').value.replace(/\D/g,'');
  if(v.length!==6){const e=document.getElementById('pin-err');e.textContent='ใส่ตัวเลข 6 หลัก';e.style.display='block';return;}
  pinClose(v);
}
function pinCancel(){pinClose(null);}
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

let customer=null, items=[], cart={};
const token=new URLSearchParams(location.search).get('t');

function showError(msg){
  document.getElementById('errpage').classList.add('show');
  document.getElementById('errmsg').textContent=msg;
  document.getElementById('cust-name').textContent='—';
}

async function init(){
  if(!token){showError('ลิงก์ไม่ครบถ้วน กรุณาใช้ลิงก์ที่ทางร้านส่งให้ในกลุ่ม LINE');return;}
  const {data,error}=await db.rpc('get_customer_by_token',{p_token:token});
  if(error||!data){showError('ลิงก์ไม่ถูกต้องหรือถูกยกเลิกแล้ว กรุณาติดต่อทางร้าน');return;}
  customer=data;
  document.getElementById('cust-name').textContent=customer.name+' ('+customer.code+')';
  document.getElementById('shop').style.display='';
  document.getElementById('cartbar').style.display='flex';
  await loadCatalog();
  subscribeStock();
  subscribeOrders();
}

let skuCats=[], catFilter='';   // หมวด SKU สำหรับจัดกลุ่มสินค้าให้ลูกค้าเลือกง่าย
const catOf = (sku) => (String(sku||'').match(/^[A-Za-z]+/)||[''])[0].toUpperCase();
function catLabel(pre){
  const c=skuCats.find(x=>String(x.prefix||'').toUpperCase()===pre);
  return c&&c.name?c.name:(pre||'อื่นๆ');
}
async function loadSkuCats(){
  try{
    const {data,error}=await db.rpc('get_sku_categories',{p_token:token});
    if(!error&&Array.isArray(data))skuCats=data;
  }catch(e){}   // ยังไม่ติดตั้ง — แสดงรวมเหมือนเดิม
}
let shipInfo={method:'',free_min:5000};   // วิธีจัดส่งของร้านนี้ + ยอดขั้นต่ำไม่เสียค่าส่ง
const isLalamove = () => String(shipInfo.method||'').toLowerCase()==='lalamove';
async function loadShipInfo(){
  try{
    const {data,error}=await db.rpc('get_customer_delivery',{p_token:token});
    if(!error&&data&&data.method!==undefined)
      shipInfo={method:data.method||'',free_min:Number(data.free_min)||5000};
  }catch(e){}   // ยังไม่ได้ติดตั้ง — หน้าใช้งานได้ปกติ ไม่แจ้งเรื่องค่าส่ง
}
let promos={};   // product_id → โปรที่กำลังลดของร้านนี้ {promo_price, normal, ends_at}
async function loadPromos(){
  try{
    const {data,error}=await db.rpc('get_customer_promos',{p_token:token});
    promos={};
    if(!error&&Array.isArray(data))data.forEach(p=>{promos[p.product_id]=p;});
  }catch(e){promos={};}   // ระบบโปรยังไม่ติดตั้ง — หน้าใช้งานได้ปกติ
}
async function loadCatalog(){
  const [{data,error}]=await Promise.all([db.rpc('get_customer_catalog',{p_token:token}),loadPromos(),loadShipInfo(),loadSkuCats()]);
  if(error){toast('โหลดสินค้าไม่ได้: '+error.message);return;}
  // เรียงชื่อตามหลักพจนานุกรมไทย + ตัวเลขในชื่อเทียบแบบตัวเลข
  items=(data||[]).sort((a,b)=>
    String(a.name||'').localeCompare(String(b.name||''),'th',{numeric:true,sensitivity:'base'})
    || String(a.sku||'').localeCompare(String(b.sku||'')));
  for(const it of items){
    if(cart[it.product_id]>it.stock_qty) cart[it.product_id]=Math.max(0,Math.floor(it.stock_qty));
  }
  render();
}

/** แถบเลือกหมวด — ขึ้นเฉพาะเมื่อร้านนี้มีสินค้ามากกว่า 1 หมวด */
function renderCatChips(){
  const el=document.getElementById('catchips');if(!el)return;
  const cnt=new Map();
  for(const it of items){const c=catOf(it.sku);cnt.set(c,(cnt.get(c)||0)+1);}
  const order=(pre)=>{const c=skuCats.find(x=>String(x.prefix||'').toUpperCase()===pre);return c?Number(c.sort_order||999):9999;};
  const cats=[...cnt.keys()].sort((a,b)=>order(a)-order(b)||catLabel(a).localeCompare(catLabel(b),'th'));
  const q=(document.getElementById('search').value||'').trim();
  if(cats.length<2||q||!skuCats.length){el.innerHTML='';return;}   // ยังไม่ติดตั้งหมวด → ไม่ต้องมีแถบ
  if(catFilter&&!cnt.has(catFilter))catFilter='';
  el.innerHTML='<button class="cchip'+(catFilter?'':' on')+'" onclick="pickCat(\'\')">ทั้งหมด<span class="cn2">'+items.length+'</span></button>'
    +cats.map(c=>'<button class="cchip'+(catFilter===c?' on':'')+'" onclick="pickCat(\''+c+'\')">'
      +esc(catLabel(c))+'<span class="cn2">'+cnt.get(c)+'</span></button>').join('');
}
function pickCat(c){
  catFilter=(catFilter===c)?'':c;
  render();
  try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){window.scrollTo(0,0);}
}
function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  let list=items.filter(it=>!q||it.name.toLowerCase().includes(q)||it.sku.toLowerCase().includes(q));
  if(!q&&catFilter)list=list.filter(it=>catOf(it.sku)===catFilter);
  // สินค้าที่กำลังลดราคาขึ้นก่อนเสมอ (ในกลุ่มเดียวกันคงลำดับชื่อไทยเดิม)
  list.sort((a,b)=>(promos[b.product_id]?1:0)-(promos[a.product_id]?1:0));
  renderCatChips();
  const banner=document.getElementById('promobanner');
  const pn=items.filter(it=>promos[it.product_id]).length;
  if(banner){
    banner.style.display=pn?'block':'none';
    if(pn)banner.textContent='🔥 โปรพิเศษสำหรับร้านคุณ '+pn+' รายการ — ลดจริงถึงเวลาหมดเขต สั่งเลย!';
  }
  const el=document.getElementById('list');
  if(!items.length){el.innerHTML='<div class="empty">ยังไม่มีสินค้าในรายการของคุณ<br>กรุณาติดต่อทางร้าน</div>';updateCartBar();return;}
  if(!list.length){el.innerHTML='<div class="empty">ไม่พบสินค้าที่ค้นหา</div>';updateCartBar();return;}
  const fmtEnds=iso=>{try{return new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}};
  const cardHtml=(it)=>{
    const stock=Number(it.stock_qty);
    const qty=cart[it.product_id]||0;
    const out=stock<=0;
    const safety=Number(it.safety_stock)||0; // ป้ายสถานะสต๊อก ไม่เปิดเผยจำนวนคงเหลือจริง
    let stockHtml = out ? '<span class="stock zero">สินค้าหมด</span>'
      : (safety>0&&stock<=safety) ? '<span class="stock low">สินค้าใกล้หมด</span>'
      : '<span class="stock ok">พร้อมจำหน่าย</span>';
    const img=it.image_url
      ?`<img class="pimg" src="${esc(it.image_url)}" loading="lazy" alt="" onclick="showImg('${esc(it.image_url)}')">`
      :`<div class="pimg-ph">🧺</div>`;
    const pm=promos[it.product_id];
    const pmSave=pm&&!hidePrice()&&Number(pm.normal)>Number(it.price);
    const badge=pm?`<div class="pbadge">🔥 โปรพิเศษ${pmSave?' ลด '+Math.round((pm.normal-it.price)/pm.normal*100)+'%':''}</div>`:'';
    const priceHtml=hidePrice()?'':(pmSave
      ?`<div class="price promo-p"><span class="old">${fmt(pm.normal)}</span>${fmt(it.price)} <small>/ ${esc(it.unit)}</small><span class="psave">ประหยัด ${fmt(pm.normal-it.price)}</span></div>`
      :`<div class="price">${fmt(it.price)} <small>/ ${esc(it.unit)}</small></div>`);
    const ends=pm?`<div class="pends">⏳ ลดถึง ${fmtEnds(pm.ends_at)} น. เท่านั้น</div>`:'';
    return `<div class="item ${out?'out':''}${pm?' promo':''}">
      ${img}
      <div class="info">
        ${badge}
        <div class="name">${esc(it.name)}</div>
        ${it.pack_info?`<div class="pack">${esc(it.pack_info)}</div>`:''}
        ${priceHtml}
        ${ends}
        ${stockHtml}
      </div>
      <div class="qtybox">
        <button class="qbtn" onclick="step(${it.product_id},-1)" ${out||qty<=0?'disabled':''}>−</button>
        <input class="qin" inputmode="numeric" value="${qty||''}" placeholder="0" ${out?'disabled':''}
          onchange="setQty(${it.product_id},this.value)">
        <button class="qbtn" onclick="step(${it.product_id},1)" ${out||qty>=stock?'disabled':''}>＋</button>
      </div>
    </div>`;
  };
  // จัดกลุ่มตามหมวด SKU — ถ้ากำลังค้นหา หรือเลือกหมวดเดียวอยู่ ให้แสดงเป็นรายการเดียวไม่ต้องมีหัวข้อ
  const grouped=!q&&!catFilter&&skuCats.length>0;
  if(!grouped){
    el.innerHTML=list.map(cardHtml).join('');
  }else{
    const promoItems=list.filter(it=>promos[it.product_id]);
    const rest=list.filter(it=>!promos[it.product_id]);
    const byCat=new Map();
    for(const it of rest){const c=catOf(it.sku);if(!byCat.has(c))byCat.set(c,[]);byCat.get(c).push(it);}
    const order=(pre)=>{const c=skuCats.find(x=>String(x.prefix||'').toUpperCase()===pre);return c?Number(c.sort_order||999):9999;};
    const cats=[...byCat.keys()].sort((a,b)=>order(a)-order(b)||catLabel(a).localeCompare(catLabel(b),'th'));
    let html=promoItems.length
      ? '<div class="cathead">🔥 โปรพิเศษของร้านคุณ</div>'+promoItems.map(cardHtml).join('')
      : '';
    for(const c of cats)
      html+='<div class="cathead">'+esc(catLabel(c))+'</div>'+byCat.get(c).map(cardHtml).join('');
    el.innerHTML=html;
  }
  updateCartBar();
}

function showImg(u){
  document.getElementById('imgview-img').src=u;
  document.getElementById('imgview').classList.add('show');
}
function step(pid,d){
  const it=items.find(x=>x.product_id===pid);if(!it)return;
  let q=(cart[pid]||0)+d;
  q=Math.max(0,Math.min(q,Math.floor(it.stock_qty)));
  cart[pid]=q; render();
}
function setQty(pid,val){
  const it=items.find(x=>x.product_id===pid);if(!it)return;
  let q=parseInt(String(val).replace(/\D/g,''),10)||0;
  const max=Math.floor(it.stock_qty);
  if(q>max){q=max;toast('สินค้านี้เหลือ '+max+' '+it.unit);}
  cart[pid]=q; render();
}

function cartItems(){
  return Object.entries(cart).filter(([,q])=>q>0).map(([pid,q])=>{
    const it=items.find(x=>x.product_id===Number(pid));
    return it?{...it,qty:q,amount:q*Number(it.price)}:null;
  }).filter(Boolean);
}
function updateCartBar(){
  const ci=cartItems();
  const total=ci.reduce((s,x)=>s+x.amount,0);
  const n=ci.reduce((s,x)=>s+x.qty,0);
  document.getElementById('cart-n').textContent=ci.length?ci.length+' รายการ · '+n+' ชิ้น':'ยังไม่ได้เลือกสินค้า';
  document.getElementById('cart-t').textContent=hidePrice()?'':fmt(total);
  document.getElementById('order-btn').disabled=!ci.length;
  renderShipNote(total, ci.length);
}
/** ยังขาดอีกเท่าไรถึงยอดส่งฟรี (คืน 0 ถ้าถึงแล้ว) */
function shipShort(total){ return Math.max(0, Number(shipInfo.free_min||0) - Number(total||0)); }
function renderShipNote(total, nItems){
  const el=document.getElementById('shipnote');if(!el)return;
  if(!isLalamove()||hidePrice()||!nItems){el.innerHTML='';return;}
  const short=shipShort(total);
  el.innerHTML=short>0
    ? '<div class="box shipwarn">🚚 สั่งเพิ่มอีก <b>'+fmt(short)+'</b> ถึงยอด '+fmt(shipInfo.free_min)+' จะไม่มีค่าส่ง'
      +'<br><span style="font-weight:400">ยอดนี้ยังไม่รวมค่าส่ง — ทางร้านจะคิดค่าส่งแล้วแจ้งบิลให้อีกครั้ง</span></div>'
    : '<div class="box shipok">🎉 ยอดถึง '+fmt(shipInfo.free_min)+' แล้ว — ไม่มีค่าส่ง</div>';
}

function openConfirm(){
  const ci=cartItems();if(!ci.length)return;
  document.getElementById('confirm-list').innerHTML=ci.map(x=>{
    const img=(items.find(p=>p.product_id===x.product_id)||{}).image_url;
    return `
    <div class="cline" style="align-items:center">
      ${img?'<img src="'+img+'" onerror="this.style.display=\'none\'" style="width:44px;height:44px;object-fit:cover;border-radius:10px;flex:none;margin-right:8px;background:#f6efe9">':''}
      <span class="cn">${esc(x.name)}</span>
      <span class="cq">${x.qty} ${esc(x.unit)}${hidePrice()?'':' × '+fmt(x.price)}</span>
      <span class="ca">${hidePrice()?'':fmt(x.amount)}</span>
    </div>`;}).join('');
  const cTotal=ci.reduce((s,x)=>s+x.amount,0);
  document.getElementById('confirm-total').textContent=hidePrice()?'—':fmt(cTotal);
  const lbl=document.getElementById('confirm-total-l');
  const cnote=document.getElementById('confirm-shipnote');
  if(isLalamove()&&!hidePrice()){
    const short=shipShort(cTotal);
    lbl.textContent='ค่าสินค้า (ยังไม่รวมค่าส่ง)';
    cnote.innerHTML=short>0
      ? '<div class="box shipwarn">🚚 ยอดยังไม่ถึง '+fmt(shipInfo.free_min)+' — <b>ขาดอีก '+fmt(short)+'</b> จึงจะไม่มีค่าส่ง'
        +'<br><span style="font-weight:400">ออเดอร์นี้จะมีค่าส่งเพิ่ม ทางร้านจะใส่ค่าส่งให้ก่อน แล้วแจ้งยอดรวมสุทธิในบิลอีกครั้ง</span></div>'
      : '<div class="box shipok">🎉 ยอดถึง '+fmt(shipInfo.free_min)+' แล้ว — ไม่มีค่าส่ง</div>';
  }else{ lbl.textContent='รวมทั้งหมด'; cnote.innerHTML=''; }
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow='hidden'; // กันหน้าหลังเลื่อนทะลุตอนเปิดชีตบน iOS
}
function closeConfirm(){document.getElementById('overlay').classList.remove('show');document.body.style.overflow='';}

async function placeOrder(){
  const ci=cartItems();if(!ci.length)return;
  const btn=document.getElementById('confirm-btn');
  btn.disabled=true;btn.textContent='กำลังส่งออเดอร์…';
  let pin=savedPin();
  if(customer&&customer.has_pin&&!pin){
    btn.disabled=false;btn.textContent='✓ ยืนยันสั่งสินค้า';
    pin=await askPin();
    if(!pin)return;
    btn.disabled=true;btn.textContent='กำลังส่งออเดอร์…';
  }
  const items=ci.map(x=>({product_id:x.product_id,qty:x.qty}));
  let {data,error}=await db.rpc('place_order_v2',{p_token:token,p_items:items,p_pin:pin||null});
  // รหัสผิด → ล้างที่จำไว้ แล้วให้กรอกใหม่ (ลองได้ 3 ครั้ง)
  for(let tryN=0;tryN<3&&error&&String(error.message||'').includes('BAD_PIN');tryN++){
    try{localStorage.removeItem(PIN_KEY());}catch(e){}
    btn.disabled=false;btn.textContent='✓ ยืนยันสั่งสินค้า';
    const again=await askPin('รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง');
    if(!again)return;
    btn.disabled=true;btn.textContent='กำลังส่งออเดอร์…';
    pin=again;
    ({data,error}=await db.rpc('place_order_v2',{p_token:token,p_items:items,p_pin:pin}));
  }
  if(!error&&pin){try{localStorage.setItem(PIN_KEY(),pin);}catch(e){}}
  btn.disabled=false;btn.textContent='✓ ยืนยันสั่งสินค้า';
  if(error){
    closeConfirm();
    if(error.message.includes('OUT_OF_STOCK')){
      const p=error.message.split('|');
      toast('ขออภัย "'+(p[1]||'สินค้า')+'" '+(p[2]||'ของไม่พอ')+' กรุณาปรับจำนวน');
      await loadCatalog();
    } else if(error.message.includes('NOT_ALLOWED')){
      toast('มีสินค้าที่ไม่อยู่ในรายการของคุณ กรุณารีเฟรชหน้า');
      await loadCatalog();
    } else if(error.message.includes('INVALID_TOKEN')){
      toast('ลิงก์ไม่ถูกต้องหรือถูกยกเลิกแล้ว กรุณาติดต่อทางร้าน');
    } else if(error.message.includes('TOO_MANY')){
      toast('สั่งถี่เกินไป กรุณารอสักครู่แล้วลองใหม่');
    } else if(error.message.includes('BAD_PIN')){
      toast('รหัสยืนยันไม่ถูกต้อง — ขอรหัสจากเจ้าของร้าน หรือพิมพ์ "เปลี่ยน <เลข 6 หลัก>" ในกลุ่มไลน์');
    } else if(error.message.includes('BAD_QTY')||error.message.includes('EMPTY')||error.message.includes('TOO_BIG')){
      toast('รายการสั่งซื้อไม่ถูกต้อง กรุณารีเฟรชหน้าแล้วลองใหม่');
      await loadCatalog();
    } else toast('สั่งไม่สำเร็จ: '+error.message);
    return;
  }
  closeConfirm();
  cart={};
  document.getElementById('s-no').textContent='เลขที่ออเดอร์ '+data.order_no;
  document.getElementById('s-total').textContent=hidePrice()?'ส่งคำสั่งซื้อแล้ว':fmt(data.total);
  const snote=document.getElementById('s-shipnote');
  if(snote){
    const short=(isLalamove()&&!hidePrice())?shipShort(Number(data.total)||0):0;
    snote.innerHTML=(isLalamove()&&!hidePrice())
      ? (short>0
        ? '<div class="box shipwarn" style="max-width:420px">🚚 ยอดนี้<b>ยังไม่รวมค่าส่ง</b> (ยังไม่ถึง '+fmt(shipInfo.free_min)+' ขาดอีก '+fmt(short)+')'
          +'<br><span style="font-weight:400">ทางร้านจะใส่ค่าส่งให้ แล้วแจ้งยอดรวมสุทธิในบิลอีกครั้ง</span></div>'
        : '<div class="box shipok" style="max-width:420px">🎉 ยอดถึง '+fmt(shipInfo.free_min)+' แล้ว — ไม่มีค่าส่ง</div>')
      : '';
  }
  document.getElementById('success').classList.add('show');
  notifyCentral(data,ci);
  notifyCustomerOrder(data,ci);
  markStaffOrder(data);
  loadCatalog();
  allOrders=[]; // ให้โหลดใหม่เมื่อเปิดแท็บประวัติ
}
// เครื่องที่เคยล็อกอินหลังบ้าน = เครื่องพนักงาน → ประทับชื่อพนักงานเป็นผู้สั่งออเดอร์นี้
// (ลูกค้าสั่งจากมือถือตัวเองจะไม่มีข้อมูลนี้ = ขึ้น "ลูกค้าสั่งเอง" ในหลังบ้าน)
async function markStaffOrder(data){
  try{
    const raw=localStorage.getItem('mix888_user');if(!raw)return;
    const u=JSON.parse(raw)||{};
    const name=u.display_name||u.username;if(!name)return;
    await db.rpc('mark_order_creator',{p_order_no:data.order_no,p_staff:name});
  }catch(e){/* เงียบไว้ ไม่กระทบการสั่ง */}
}
// แจ้งกลุ่ม LINE ของลูกค้าเองว่ารับออเดอร์แล้ว
async function notifyCustomerOrder(data,ci){
  try{
    const gid=customer.line_group_id;if(!gid)return;
    const shopName=(customer.name||'')+(customer.branch_name?' • '+customer.branch_name:'')+(customer.code?' ('+customer.code+')':'');
    let t='🏪 '+shopName+'\n✅ รับออเดอร์ '+data.order_no+' เรียบร้อยแล้ว\nสถานะ: กำลังดำเนินการ กำลังจัดเตรียมสินค้า\n──────────\nรายการ :';
    ci.forEach(x=>{t+='\n'+x.name+' '+x.qty+' '+(x.unit||'');});
    t+='\n\nขอบคุณที่สั่งสินค้าครับ 🙏';
    await db.functions.invoke('line-push',{body:{to:gid,messages:[{type:'text',text:t}]}});
  }catch(e){/* เงียบไว้ */}
}
async function notifyCentral(data,ci){
  try{
    // ส่งทั้งกลุ่มกลาง และกลุ่มสรุปออเดอร์ (เซลล์) — ไม่ซ้ำถ้าตั้งเป็นกลุ่มเดียวกัน
    const {data:st}=await db.from('settings').select('key,value').in('key',['line_central_group','line_summary_group']);
    const gids=[...new Set((st||[]).map(r=>r.value).filter(Boolean))];
    if(!gids.length)return;
    const c=customer;
    let t='🆕 ออเดอร์ใหม่ '+data.order_no+'\n';
    if(c.sale_name)t+='Sale : '+c.sale_name+'\n';
    t+='ร้าน : '+c.name+' ('+c.code+')\n';
    t+='ผู้รับ : '+(c.ship_receiver||c.contact_name||'-');
    const ph=c.ship_phone||c.phone;if(ph)t+='  โทร '+ph;
    t+='\nวิธีส่ง : '+(c.delivery_method||'-');
    if(c.receive_time)t+='\nเวลารับของ : '+c.receive_time;
    if(c.map_link)t+='\nMap : '+c.map_link;
    const addr=c.ship_address||c.billing_address;if(addr)t+='\nที่อยู่ : '+addr;
    t+='\n──────────\nรายการ :';
    ci.forEach(x=>{t+='\n'+x.name+' '+x.qty+' '+(x.unit||'');});
    if(!hidePrice()) t+='\nรวม '+fmt(data.total);
    if(c.note)t+='\nหมายเหตุ : '+c.note;
    for(const gid of gids){
      await db.functions.invoke('line-push',{body:{to:gid,messages:[{type:'text',text:t}]}});
    }
  }catch(e){/* เงียบไว้ ไม่รบกวนลูกค้า */}
}
function backToShop(){
  document.getElementById('success').classList.remove('show');
  window.scrollTo(0,0);
}

let allOrders=[];
function showTab(t){
  document.getElementById('tab-order').classList.toggle('active',t==='order');
  document.getElementById('tab-history').classList.toggle('active',t==='history');
  document.getElementById('page-order').style.display=t==='order'?'':'none';
  document.getElementById('page-history').style.display=t==='history'?'':'none';
  document.getElementById('cartbar').style.display=t==='order'?'flex':'none';
  if(t==='history') loadHistory();
}
function histRange(r){
  document.querySelectorAll('.qb').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  const to=new Date(), from=new Date();
  const fmtd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  document.getElementById('h-to').value=fmtd(to);
  if(r==='all'){document.getElementById('h-from').value='';document.getElementById('h-to').value='';}
  else{from.setDate(to.getDate()-Number(r));document.getElementById('h-from').value=fmtd(from);}
  renderHistory();
}
async function loadHistory(){
  const {data,error}=await db.rpc('get_customer_orders',{p_token:token});
  if(error){console.warn(error);return;}
  allOrders=data||[];
  if(!document.getElementById('h-from').value && !document.getElementById('h-to').value){
    // ตั้งค่าเริ่มต้น 30 วัน
    const to=new Date(), from=new Date();from.setDate(to.getDate()-30);
    const fmtd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    document.getElementById('h-from').value=fmtd(from);
    document.getElementById('h-to').value=fmtd(to);
  }
  renderHistory();
}
function orderSteps(o){
  const bill=(o.bills&&o.bills[0])||null;
  const cancelled=o.status==='cancelled'||(bill&&bill.ship_status==='cancelled');
  const billed=!!bill;
  const shipped=bill&&bill.ship_status==='shipped';
  const paid=bill&&bill.payment_status==='paid';
  return {cancelled,ordered:true,billed,shipped,paid};
}
function renderHistory(){
  const from=document.getElementById('h-from').value;
  const to=document.getElementById('h-to').value;
  let list=allOrders.filter(o=>{
    if(from&&new Date(o.created_at)<new Date(from+'T00:00:00'))return false;
    if(to&&new Date(o.created_at)>new Date(to+'T23:59:59'))return false;
    return true;
  });
  const total=list.reduce((s,o)=>s+Number(o.total),0);
  document.getElementById('hist-summary').textContent=list.length+' ออเดอร์'+(hidePrice()?'':' · รวม '+fmt(total));
  const body=document.getElementById('hist-body');
  if(!list.length){body.innerHTML='<div class="empty">ไม่มีออเดอร์ในช่วงนี้</div>';return;}
  body.innerHTML=list.map(o=>{
    const d=new Date(o.created_at).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'});
    const s=orderSteps(o);
    const bill=(o.bills&&o.bills[0])||null;
    if(s.cancelled){
      return `<div class="ocard" style="opacity:.65">
        <div class="oh"><div><div class="ono">${esc(o.order_no)}</div><div class="od">${d}</div></div>
          <div class="oa">${hidePrice()?'':fmt(o.total)}<br><span class="tag tag-new" style="background:var(--danger-soft);color:var(--danger)">ยกเลิกแล้ว</span></div></div></div>`;
    }
    const step=(label,done,icon)=>`<div class="step ${done?'done':'wait'}"><div class="dot">${done?'✓':icon}</div>${label}</div>`;
    // ป้ายสถานะล่าสุด (เป็นคำ)
    let statusLabel,statusColor;
    if(s.paid){statusLabel='รับชำระแล้ว';statusColor='var(--ok)';}
    else if(s.shipped){statusLabel='จัดส่งแล้ว';statusColor='#0f6e56';}
    else if(s.billed){statusLabel='ออกบิลแล้ว · รอจัดส่ง';statusColor='#b8860b';}
    else{statusLabel='รับออเดอร์ · กำลังเตรียมของ';statusColor='var(--muted)';}
    // สถานะเงิน (แสดงเมื่อออกบิลแล้ว)
    const payTag = s.billed
      ? (s.paid?'<span class="paytag paid">💰 จ่ายแล้ว</span>':'<span class="paytag unpaid">⏳ ค้างจ่าย</span>')
      : '';
    return `<div class="ocard">
      <div class="oh">
        <div><div class="ono">${esc(o.order_no)}</div><div class="od">${d}${bill?' · บิล '+esc(bill.bill_no):''}</div></div>
        <div class="oa">${hidePrice()?'':fmt(o.total)}</div>
      </div>
      <div class="statusrow"><span class="statusbadge" style="background:${statusColor}">${statusLabel}</span>${payTag}</div>
      <div class="steps">
        ${step('รับออเดอร์',s.ordered,'1')}
        ${step('ออกบิล',s.billed,'2')}
        ${step('จัดส่ง',s.shipped,'3')}
        ${step('ชำระเรียบร้อย',s.paid,'4')}
      </div>
    </div>`;
  }).join('');
}

// realtime สถานะออเดอร์/บิล — อัปเดตหน้าประวัติทันทีเมื่อร้านออกบิล/จัดส่ง/รับชำระ
let histTimer=null;
function refreshHistorySoon(){
  clearTimeout(histTimer);
  histTimer=setTimeout(()=>{ loadHistory(); },400);
}
function subscribeOrders(){
  db.channel('orders-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:'customer_id=eq.'+customer.id},refreshHistorySoon)
    .on('postgres_changes',{event:'*',schema:'public',table:'bills',filter:'customer_id=eq.'+customer.id},refreshHistorySoon)
    .subscribe();
  // ตารางถูกล็อกด้วย RLS แล้ว realtime จะไม่ส่งให้ลูกค้า → เช็คเองเป็นระยะ (เฉพาะตอนเปิดหน้าอยู่)
  setInterval(()=>{ if(!document.hidden) refreshHistorySoon(); }, 60000);
  setInterval(()=>{ if(!document.hidden) loadCatalog(); }, 90000);   // สต๊อก/ราคาอัปเดต
}
function subscribeStock(){
  db.channel('stock-live')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'products'},payload=>{
      const it=items.find(x=>x.product_id===payload.new.id);
      if(it){
        it.stock_qty=payload.new.stock_qty;
        if(cart[it.product_id]>it.stock_qty) cart[it.product_id]=Math.max(0,Math.floor(it.stock_qty));
        render();
      }
    }).subscribe();
}
